services:
  - type: web
    name: vertice
    runtime: node
    plan: free
    buildCommand: npm run install:api
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_NAME
        value: Admin Vertice
      - key: ADMIN_EMAIL
        value: admin@vertice.local
      - key: ADMIN_PASSWORD
        sync: false
